    let city = /^(UTC|Etc\/)/.test(tz) ? 'UTC' : tz.split('/').pop().replace(/_/g, ' ');

function person(x, y, look, frame, facing){

  if (head === 'kurung'){ R(x,y-3,x+2,y-1,bot); P(x+(frame?0:2), y-1, DK); }
  else { R(x,y-3,x+2,y-3,bot);
    if (frame === 0){ P(x,y-2,bot); P(x+2,y-2,bot); P(x,y-1,DK); P(x+2,y-1,DK); } else { P(x+1,y-2,bot); P(x+1,y-1,DK); } }
  R(x,y-6,x+2,y-4,top); R(x,y-7,x+2,y-7,skin);
  const back = facing > 0 ? x : x+2, front = facing > 0 ? x+2 : x;
  if (head === 'tudung' || head === 'kurung'){ R(x,y-8,x+2,y-8,hcol); P(back,y-7,hcol); R(x,y-6,x+2,y-6,hcol); }
  else if (head === 'songkok') R(x,y-8,x+2,y-8,[20,20,20]);
  else if (head === 'cap'){ R(x,y-8,x+2,y-8,hcol); P(front+(facing>0?1:-1), y-8, hcol); }
  else { R(x,y-8,x+2,y-8,hcol); P(back,y-7,hcol); }
}
function flag(x, y, px, q, amp, k, ph){ const h = px.length, w = px[0].length;
  for (let c = 0; c < w; c++){ const a = c*0.42 - TAU*q*k + ph, dy = Math.round(amp*Math.sin(a)*(0.25+0.75*c/w)), sh = 1 - 0.16*Math.cos(a)*(c/w);
    for (let r = 0; r < h; r++) P(x+c, y+r+dy, shade(px[r][c], sh)); } }

/* ---------- light (canvas coordinates; *S helpers add the scene offset) ---------- */
const kern = {};
function kernel(r){ if (!kern[r]){ const s = 4*r+1, k = new Float32Array(s*s);
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++){ const dx = x-2*r, dy = y-2*r; k[y*s+x] = Math.exp(-(dx*dx+dy*dy)/(2*r*r)); } kern[r] = k; } return kern[r]; }
function glow(buf, x, y, r, col, s){ if (s <= 0.001) return; const k = kernel(r), sz = 4*r+1, h = 2*r; x = T(x); y = T(y);
  for (let j = 0; j < sz; j++){ const yy = y-h+j; if (yy < 0 || yy >= S.CH) continue;
    for (let i = 0; i < sz; i++){ const xx = x-h+i; if (xx < 0 || xx >= S.CW) continue; const v = k[j*sz+i]*s, o = (yy*S.CW+xx)*3;
      buf[o] += col[0]*v; buf[o+1] += col[1]*v; buf[o+2] += col[2]*v; } } }
const glowS = (x, y, r, c, s) => glow(S.ADD, x + S.ox, y + S.oy, r, c, s);
function emitPx(x, y, c, a){ x = T(x); y = T(y); if (x < 0 || y < 0 || x >= S.CW || y >= S.CH) return; const i = y*S.CW+x;
  S.E[i*3]=c[0]; S.E[i*3+1]=c[1]; S.E[i*3+2]=c[2]; S.EA[i]=Math.max(S.EA[i], a); }
const emitS = (x, y, c, a) => emitPx(x + S.ox, y + S.oy, c, a);
function emitRect(x0, y0, x1, y1, c, a){ for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) emitPx(x, y, c, a); }
function text(str, x, y, sc, col, shadow){ let cx = x;
  for (const ch of str){ const g = FONT[ch] || FONT[' '];
    for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) if (g[r*3+c] === '1'){
      if (shadow) emitRect(cx+c*sc+1, y+r*sc+1, cx+c*sc+sc, y+r*sc+sc, [0.06,0.07,0.16], 0.85);
      emitRect(cx+c*sc, y+r*sc, cx+c*sc+sc-1, y+r*sc+sc-1, col, 1); }
    cx += 4*sc; } }
const textS = (str, x, y, sc, col) => text(str, x + S.ox, y + S.oy, sc, col, false);
const tw = (s, sc) => s.length*4*sc - sc;

function sample(p){ const K = S.D.keys, n = K.length;
  for (let i = 0; i < n; i++){ const p0 = K[i].p; const p1 = i === n-1 ? K[0].p + 1 : K[i+1].p;
    if (p >= p0 && p < p1){ let t = (p-p0)/(p1-p0); t = t*t*(3-2*t); const a = K[i], b = K[(i+1)%n], o = {};
      for (const key of ['top','bot','tint','chi','clo']) o[key] = a[key].map((v,j) => v + (b[key][j]-v)*t);
      o.night = a.night + (b.night-a.night)*t; return o; } }
  return K[0]; }

/* ---------- countdown: pick the biggest pixel size that fits the sky ---------- */
function countdownLines(now_){
  const two = v => String(v).padStart(2, '0'), rem = RACE - now_, W = S.CW - 12, room = S.flagTop - 6;
  const gap = sc => sc + 2, height = ls => ls.reduce((a, [, sc]) => a + 5*sc + gap(sc), 0) - 2;
  const fits = ls => ls.every(([s, sc]) => tw(s, sc) <= W) && height(ls) <= room;
  let build;
  if (now_ >= RACE_END) build = (ds, ls) => { const msg = 'HOPE TO SEE YOU AT SEPANG AGAIN';
    return tw(msg, ls) <= W ? [['CHEQUERED FLAG', ds, 'g'], [msg, ls, 'w']]
                            : [['CHEQUERED FLAG', ds, 'g'], ['HOPE TO SEE YOU', ls, 'w'], ['AT SEPANG AGAIN', ls, 'w']]; };
  else if (rem <= 0) build = (ds, ls) => [['LIGHTS OUT!', ds, 'g'], ['RACE IS LIVE', ls, 'w']];
  else {
    const s = Math.floor(rem/1000), d = Math.floor(s/86400), clock = two(Math.floor(s%86400/3600)) + ':' + two(Math.floor(s%3600/60)) + ':' + two(s%60);
    build = (ds, ls) => { const out = [['LIGHTS OUT IN', ls, 'w']], one = (d ? d + 'D ' : '') + clock;
      if (tw(one, ds) <= W) out.push([one, ds, 'g']); else { if (d) out.push([d + (d === 1 ? ' DAY' : ' DAYS'), ds, 'g']); out.push([clock, ds, 'g']); }
      const single = LOCAL.when + ' ' + LOCAL.place;
      if (tw(single, ls) <= W) out.push([single, ls, 'b']); else { out.push([LOCAL.when, ls, 'b']); out.push([LOCAL.place, ls, 'b']); }
      return out; };
    if (Math.floor(now_/60000) !== countdownLines.m){ countdownLines.m = Math.floor(now_/60000);
      document.getElementById('sr').textContent = d + ' days, ' + Math.floor(s%86400/3600) + ' hours and ' + Math.floor(s%3600/60) + ' minutes until lights out, ' + LOCAL.when.toLowerCase() + ' ' + LOCAL.place.toLowerCase() + '.'; }
  }
  for (let ds = 6; ds >= 2; ds--){ const ls = Math.max(1, Math.min(3, ds - 2)), L = build(ds, ls); if (fits(L)) return L; }
  return build(2, 1);
}

/* ---------- one frame ---------- */
let lastSky = 0;
function frame(now){
  const {D, CW, CH, N, fg, sky, E, EA, ADD, ox, oy, hz} = S, L = D.L;
  const sec = reduce ? 0 : (now / 1000) % 60, q = sec / 60, fi = Math.floor(sec * 30);
  const p = reduce ? 0.2 : q;                                    // day-to-night time-lapse, one day per minute
  const k = sample(p), n = k.night;
  const now_ = Date.now() + OFFSET, live = now_ >= RACE && now_ < RACE_END, done = now_ >= RACE_END;

  for (let i = 0; i < N; i++){ const g = S.G[i]; sky[i*3]=k.top[0]+(k.bot[0]-k.top[0])*g; sky[i*3+1]=k.top[1]+(k.bot[1]-k.top[1])*g; sky[i*3+2]=k.top[2]+(k.bot[2]-k.top[2])*g; }
  if (n > 0.01) for (const [sx, sy, ph, sk, sb] of S.stars){ const b = sb*(0.55+0.45*Math.sin(TAU*(q*sk+ph)))*n, o = (sy*CW+sx)*3;
    sky[o]=sky[o]*(1-b)+b; sky[o+1]=sky[o+1]*(1-b)+b; sky[o+2]=sky[o+2]*(1-b)+b*0.92; }
  ADD.fill(0);
  const disc = (x, y, r, col) => { x = T(x); y = T(y); for (let dy = -r; dy <= r; dy++){ const yy = y+dy; if (yy < 0 || yy >= CH) continue;
    const w = T(Math.sqrt(r*r-dy*dy)+0.3); for (let xx = Math.max(0,x-w); xx <= Math.min(CW-1,x+w); xx++){ const o=(yy*CW+xx)*3; sky[o]=col[0]; sky[o+1]=col[1]; sky[o+2]=col[2]; } } };
  const s_ = ((p + 0.05) % 1) / 0.53;
  if (s_ < 1){ const x = 30 + (CW-60)*s_, y = hz + 6 - Math.sin(Math.PI*s_)*(hz-30), hi = Math.sqrt(Math.sin(Math.PI*s_));
    const col = [1, 0.55+0.42*hi, 0.3+0.5*hi]; disc(x, y, 7, col); glow(ADD, x, y, 12, col, 0.28); glow(ADD, x, y, 30, col, 0.10); }
  const m_ = (p - 0.53) / 0.4;
  if (m_ >= 0 && m_ < 1){ const x = 40 + (CW-80)*m_, y = hz - 10 - Math.sin(Math.PI*m_)*(hz-45); disc(x, y, 5, [0.96,0.95,0.86]);
    for (const [dx, dy] of [[-1,-1],[2,1],[0,2]]){ const o = ((T(y)+dy)*CW + T(x)+dx)*3; if (o >= 0){ sky[o]*=.85; sky[o+1]*=.85; sky[o+2]*=.85; } }
    glow(ADD, x, y, 10, [0.6,0.65,0.9], 0.12); }
  for (let i = 0; i < N*3; i++) sky[i] += ADD[i];
  ADD.fill(0);
  const edge = k.chi.map(v => Math.min(1, v*1.04+0.05)), cyo = Math.round(oy * 0.6);
  for (const c of S.clouds){ const cx = T(-c.w - 10 + ((q*c.k + c.off) % 1) * (CW + c.w + 20));
    for (let y = 0; y < c.h; y++){ const yy = c.y + cyo + y; if (yy >= CH) break;
      for (let x = 0; x < c.w; x++){ const xx = cx + x; if (xx < 0 || xx >= CW) continue; const v = c.m[y*c.w+x]; if (!v) continue;
        const col = v === 1 ? k.clo : v === 2 ? k.chi : edge, o = (yy*CW+xx)*3; sky[o]=col[0]; sky[o+1]=col[1]; sky[o+2]=col[2]; } } }

  const main = [], back = [];
  D.cars.forEach((c, i) => { const dt = (((sec - c.t) % D.lap) + D.lap) % D.lap, x = -ox - 40 + dt*L.V; if (x < CW - ox + 40) main.push([c, x, i]);
    const dt2 = (((sec - c.t - 5) % D.lap) + D.lap) % D.lap, x2 = CW - ox + 10 - dt2*L.VB; if (x2 > -ox - 20) back.push([c, x2, i]); });
  main.sort((a, b) => a[0].line - b[0].line);

  fg.set(S.bg);
  let plane = null;
  for (const [p0, p1] of [[0.08,0.2],[0.36,0.47],[0.7,0.81]]) if (q >= p0 && q < p1){ const t = (q-p0)/(p1-p0); plane = [T(CW - ox + 20 - t*(CW+70)), T(L.plane[0]-t*L.plane[1])]; }
  if (plane){ const [x, y] = plane; R(x,y,x+17,y+2,[238,240,242]); R(x-1,y+1,x,y+2,[238,240,242]); R(x+14,y-4,x+17,y-1,[200,16,46]);
    R(x+5,y+3,x+10,y+3,[176,184,192]); R(x+6,y+4,x+8,y+4,[138,144,152]); for (let i = 2; i < 13; i += 2) P(x+i,y+1,[60,90,120]); R(x,y+2,x+16,y+2,[192,198,204]); }
  for (const [c, x, i] of back) blit(S.small, 0, i*5, 12, 5, T(x), L.backY);
  over(S.mid, S.midI);

  const cr = D.crowd; let cnt = 0;
  for (let j = 0; j < cr.length; j += 2){ const cx = cr[j], cy = cr[j+1];
    let up = ((cx*7919 + cy*104729 + Math.floor(fi/6)*31) % 97) < 3;
    if (!up) for (const [, x] of main) if (cx > x-70 && cx < x+8){ up = true; break; }
    if (up) P(cx, cy-1, (cnt++ % 2) ? D.skins[1] : D.skins[0]); }
  for (const f of D.flags) flag(f.x, f.y, f.px, q, 1.6, 40, f.ph);
  for (const [c, x, i] of main){ const y = c.line; R(x+2,y+1,x+29,y+1,[42,44,48]);
    for (let j = 1; j < 24; j++){ if ((j+fi) % 2 === 0 || j < 5){ const tt = j/24; P(x-j, y-4+(j%3===0?1:0), j < 10 ? shade(c.pri, 0.9-tt*0.5) : [90,94,100]); }
      if (j % 4 === 0) P(x-j*1.5, y-8, [106,110,116]); }
    blit(S.sheet, (fi%4)*32, i*11, 32, 11, T(x), T(y)-10); }
  over(S.front, S.frontI); over(S.top, S.topI);

  const wv = Math.floor(q*200) % 2, [mx, my] = L.marshal;
  R(mx, my+wv, mx, my+4, [138,138,138]);
  if (done){ for (let yy = 0; yy < 3; yy++) for (let xx = 0; xx < 5; xx++) P(mx+1-wv+xx, my+wv+yy, (xx + yy) % 2 ? [20,20,20] : [245,245,245]); }
  else R(mx+1-wv, my+wv, mx+5-wv, my+2+wv, [26,168,74]);
  for (const sp of D.spect){ const {x, y, look} = sp; const excited = main.some(([, xx]) => xx-90 < x && x < xx+10);
    if (sp.k === 'sit' || sp.k === 'umb'){ R(x,y-5,x+2,y-3,look[1]); R(x,y-6,x+2,y-6,look[0]); R(x,y-7,x+2,y-7,look[4] || [20,20,20]); R(x-1,y-2,x+3,y-2,look[2]);
      if (excited && sp.k === 'sit'){ P(x-1,y-8,look[0]); P(x+3,y-8,look[0]); }
      if (sp.k === 'umb'){ R(x+1,y-12,x+1,y-7,[58,58,58]); R(x-3,y-13,x+5,y-12,sp.umb); R(x-1,y-14,x+3,y-14,sp.umb); for (const qq of [x-3,x+1,x+5]) P(qq,y-12,shade(sp.umb,.8)); } }
    else { const jump = (excited && Math.floor(fi/3) % 2) ? 1 : 0; person(x, y-jump, look, 0, 1);
      if (sp.k === 'flag'){ R(x+3,y-14-jump,x+3,y-6-jump,[138,138,138]); const fl = D.sflags[sp.fl];
        for (let cc = 0; cc < 6; cc++){ const dy = Math.round(Math.sin(cc*0.9 - TAU*q*50 - sp.ph*6)); for (let rr = 0; rr < 4; rr++) P(x+4+cc, y-14-jump+rr+dy, fl[rr][cc]); } }
      else if (excited){ P(x-1,y-8-jump,look[0]); P(x+3,y-8-jump,look[0]); } } }

  E.set(S.Es); for (let i = 0; i < N; i++) EA[i] = S.EAs[i]*n;
  for (const [x, y, r, c, st] of D.glows) glowS(x, y, r, c, st*n);
  if (n > 0.01){ for (let y = L.track[0] + oy; y < L.track[1] + oy; y++) for (let x = 0; x < CW; x++){ const o=(y*CW+x)*3; ADD[o]+=.13*n; ADD[o+1]+=.13*n; ADD[o+2]+=.14*n; }
    for (let y = L.stand[0] + oy; y < L.stand[1] + oy; y++) for (let x = L.stand[2] + ox; x < L.stand[3] + ox; x++){ const o=(y*CW+x)*3; ADD[o]+=.10*n; ADD[o+1]+=.09*n; ADD[o+2]+=.07*n; } }
  const py = L.pyl;
  textS('SEPANG', py.t1[0], py.t1[1], 1, [1,0.85,0.2]);
  textS(live ? 'LAP ' + Math.min(56, 1 + Math.floor((now_-RACE)/(100*60e3/56))) : done ? 'FINISH' : 'OCT 4', py.t2[0], py.t2[1], 1, [1,1,1]);
  S.order.slice(0, py.rows).forEach((ci, r) => { const y = py.y0 + r*py.dy, c = D.cars[ci].pri.map(v => v/255);
    textS(String(r+1), py.nx, y, 1, [1,1,1]);
    for (let yy = y; yy <= y+4; yy++) for (let xx = py.bx; xx <= py.bx+1; xx++) emitS(xx, yy, c, 1);
    for (let yy = y+1; yy <= y+3; yy++) for (let xx = py.bar[0]; xx < py.bar[1]; xx++) emitS(xx, yy, [.25,.28,.32], .9);
    for (let xx = py.bar[0]; xx < py.bar[0] + py.wl[0] - T(r*py.wl[1]); xx++) emitS(xx, y+2, c, 1); });
  glowS(L.pylonGlow[0], L.pylonGlow[1], 14, [1,.9,.6], .05);
  const bl = (q*60) % 1 < 0.5 ? 1 : 0.2;
  for (const [x, y] of D.avi){ emitS(x, y, [1,.15,.1], bl); glowS(x, y, 2, [1,.2,.1], .35*bl); }
  if (plane){ const b = (q*90) % 1 < 0.3 ? 1 : 0; glowS(plane[0]+16, plane[1]-4, 1, [1,.2,.2], .7*b); glowS(plane[0]-1, plane[1]+2, 2, [1,1,.9], (0.5+0.5*n)*0.6); }
  if (Math.floor(fi/4) % 2) for (const [c, x] of main) glowS(x+1, c.line-5, 1, [1,.1,.05], .8);
  if (n > 0.3) for (let j = 0; j < cr.length; j += 2){ const cx = cr[j], cy = cr[j+1];
    if (((cx*131 + cy*977 + fi*7) % 1301) === 0){ emitS(cx, cy, [1,1,1], 1); glowS(cx, cy, 2, [1,1,1], .5*n); } }
  if (n > 0.2) S.fw.forEach(([fx, fy, col], i) => { const lt = ((sec - i*6) % 60 + 60) % 60;
    if (lt < 0.72){ const u = lt/0.72; glowS(fx, L.fwY - (L.fwY-fy)*u, 1, [1,.9,.6], .6*n); }
    else if (lt < 2.82){ const u = (lt-0.72)/2.1, fade = Math.pow(1-u, 1.4); glowS(fx, fy, 10, col, .18*fade*n);
      for (let a = 0; a < 360; a += 12){ const ra = a*Math.PI/180, rr = 26*(1-Math.pow(1-u, 2.2));
        const xi = fx + Math.cos(ra)*rr, yi = fy + Math.sin(ra)*rr*0.9 + 18*u*u;
        emitS(xi, yi, col, fade*n); if (a % 24 === 0) glowS(xi, yi, 1, col, .35*fade*n); } } });

  /* countdown in pixels, centred in the sky above the tower flag */
  const lines = countdownLines(now_), cols = {g: [1,.82,.25], w: [.93,.95,1], b: [.68,.88,1]}, gap = sc => sc + 2;
  const bh = lines.reduce((a, [, sc]) => a + 5*sc + gap(sc), 0) - 2;
  let y = Math.max(3, Math.floor((S.flagTop - bh) / 2));
  for (const [s, sc, c] of lines){ text(s, Math.floor((CW - tw(s, sc))/2), y, sc, cols[c], true); y += 5*sc + gap(sc); }

  const out = S.img.data, t0 = k.tint[0], t1 = k.tint[1], t2 = k.tint[2];
  for (let i = 0; i < N; i++){ const a = fg[i*4+3]/255, ia = 1-a, o = i*3, ea = EA[i], iea = 1-ea;
    let r = sky[o]*ia + fg[i*4]/255*t0*a, g = sky[o+1]*ia + fg[i*4+1]/255*t1*a, b = sky[o+2]*ia + fg[i*4+2]/255*t2*a;
    if (ea > 0){ r = r*iea + E[o]*ea; g = g*iea + E[o+1]*ea; b = b*iea + E[o+2]*ea; }
    out[i*4] = (r + ADD[o])*255 + .5; out[i*4+1] = (g + ADD[o+1])*255 + .5; out[i*4+2] = (b + ADD[o+2])*255 + .5; out[i*4+3] = 255; }
  ctx.putImageData(S.img, 0, 0);
  if (now - lastSky > 1000){ lastSky = now; document.documentElement.style.setProperty('--sky', 'rgb(' + k.top.map(v => Math.round(v*255)).join(',') + ')'); }
}

let last = 0, busy = false, rt = null;
function loop(now){ if (S && !busy && now - last >= (reduce ? 1000 : 33)){ last = now; frame(now); } requestAnimationFrame(loop); }
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(async () => { busy = true; await init(); busy = false; }, 120); });
init().then(() => requestAnimationFrame(loop));
</script>
